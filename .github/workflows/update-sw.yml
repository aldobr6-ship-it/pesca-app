name: Aggiorna versione Service Worker

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/**'

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Genera nuova versione
        run: |
          VERSION=$(date +%Y%m%d%H%M%S)
          sed -i "s/pesca-app-[a-zA-Z0-9_]*\"/pesca-app-${VERSION}\"/" sw.js

      - name: Salva la modifica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --staged --quiet || git commit -m "Auto-aggiorna versione cache [skip ci]"
          git push
