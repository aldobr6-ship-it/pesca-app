name: 'Genera EXE Autonomo'

on:
  workflow_dispatch: # Ti permette di avviare la creazione con un click

jobs:
  crea-eseguibile:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Inizializza e Compila con Tauri
        run: |
          npm install -g @tauri-apps/cli
          npx tauri init --app-name "AdelTechnic-FISH" --window-title "AdelTechnic-FISH" --dist-dir "." --dev-path "https://github.io"
          npx tauri build
