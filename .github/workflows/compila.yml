name: 'Genera EXE Autonomo'

on:
  workflow_dispatch:

jobs:
  crea-eseguibile:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Configura Server Locale Invisibile e Compila
        run: |
          npm init -y
          npm install electron electron-builder express --save-dev
          
          # Crea il file di avvio con un server locale Express integrato
          echo "const { app, BrowserWindow } = require('electron');" > main.js
          echo "const express = require('express');" >> main.js
          echo "const path = require('path');" >> main.js
          echo "const server = express();" >> main.js
          echo "const PORT = 49152;" >> main.js
          echo "server.use(express.static(__dirname));" >> main.js
          echo "server.get('*', (req, res) => { res.sendFile(path.join(__dirname, 'index.html')); });" >> main.js
          echo "let serverInstance = server.listen(PORT);" >> main.js
          echo "function createWindow () {" >> main.js
          echo "  const win = new BrowserWindow({ width: 1024, height: 768, icon: __dirname + '/icona.ico', autoHideMenuBar: true });" >> main.js
          echo "  win.loadURL('http://localhost:' + PORT);" >> main.js
          echo "}" >> main.js
          echo "app.whenReady().then(createWindow);" >> main.js
          echo "app.on('window-all-closed', () => { if (serverInstance) serverInstance.close(); app.quit(); });" >> main.js
          
          # Configura i dettagli dell'app nel file package.json
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          pkg.name = 'adeltechnic-fish';
          pkg.version = '1.0.0';
          pkg.main = 'main.js';
          pkg.build = {
            appId: 'com.adeltechnic.fish',
            win: { target: 'portable', icon: 'icona.ico' },
            files: ['main.js', 'index.html', 'manifest.json', 'img/**/*', 'Assets/**/*', 'node_modules/**/*']
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          
          npx electron-builder --windows

      - name: Carica l'Eseguibile Pronto
        uses: actions/upload-artifact@v4
        with:
          name: AdelTechnic-FISH-Locale-EXE
          path: dist/*.exe
