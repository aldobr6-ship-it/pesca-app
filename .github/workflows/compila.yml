name: 'Genera EXE Autonomo'

on:
  workflow_dispatch:

jobs:
  crea-eseguibile:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Installa Rust Base
        uses: dtolnay/rust-toolchain@stable

      - name: Compilazione Standalone Integrata
        run: |
          npm install -g @tauri-apps/cli
          npx tauri init --app-name "AdelTechnic-FISH" --window-title "AdelTechnic-FISH" --dist-dir "." --dev-path "https://github.io"
          
          # Inserisce la configurazione per includere le immagini e i file della PWA nell'eseguibile offline
          node -e "
          const fs = require('fs');
          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
          conf.bundle.active = false;
          conf.tauri.allowlist = { all: true };
          conf.tauri.bundle = { resources: ['img/**/*', 'Assets/**/*'] };
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          "
          
          npx tauri build

      - name: Carica l'Eseguibile Pronto
        uses: actions/upload-artifact@v4
        with:
          name: AdelTechnic-FISH-Definitivo
          path: src-tauri/target/release/AdelTechnic-FISH.exe
