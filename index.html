button {

function t(chiave) {
  return traduzioni[linguaAttuale][chiave] || traduzioni.it[chiave] || chiave;
}
async function cambiaLingua(lingua) {
  linguaAttuale = lingua;
  localStorage.setItem("lingua", lingua);
  document.getElementById("btnLangIt").style.opacity = lingua === "it" ? "1" : "0.4";
  document.getElementById("btnLangFr").style.opacity = lingua === "fr" ? "1" : "0.4";
  aggiornaFooter();
  try {
    const fileNodi = lingua === "fr" ? "./data/nodi.fr.json" : "./data/nodi.json";
    const fileMontature = lingua === "fr" ? "./data/montature.fr.json" : "./data/montature.json";
    const fileSpecie = lingua === "fr" ? "./data/specie.fr.json" : "./data/specie.json";
    const [resNodi, resMontature, resSpecie] = await Promise.all([fetch(fileNodi), fetch(fileMontature), fetch(fileSpecie)]);
    nodiData = await resNodi.json();
    montatureData = await resMontature.json();
    specie = await resSpecie.json();
  } catch(e) { console.error("Errore ricaricamento dati:", e); }
  showHome();
}
function caricaLingua() {
  const splashSub = document.getElementById("splashSubtitle");
  if (splashSub) splashSub.textContent = t('metaPesca');
  const salvata = localStorage.getItem("lingua");
  if (salvata) linguaAttuale = salvata;
  document.getElementById("btnLangIt").style.opacity = linguaAttuale === "it" ? "1" : "0.4";
  document.getElementById("btnLangFr").style.opacity = linguaAttuale === "fr" ? "1" : "0.4";
  aggiornaFooter();
}
  function aggiornaFooter() {
  document.getElementById("fLabelHome").textContent = t('footerHome');
  document.getElementById("fLabelTecniche").textContent = t('footerTecniche');
  document.getElementById("fLabelSpecie").textContent = t('footerSpecie');
  document.getElementById("fLabelMontature").textContent = t('footerMontature');
  document.getElementById("fLabelNodi").textContent = t('footerNodi');
  document.getElementById("fLabelMeteo").textContent = t('footerMeteo');
  document.getElementById("fLabelQuando").textContent = t('footerQuando');
  document.getElementById("fLabelEsci").textContent = t('footerEsci');
}
function aggiornaLabelTema() {
  const label = document.getElementById("temaLabel");
  if (label) {
    label.textContent = document.body.classList.contains("dark")
      ? (linguaAttuale === "fr" ? "Thème clair" : "Tema Chiaro")
      : (linguaAttuale === "fr" ? "Thème sombre" : "Tema Scuro");
  }
}
/* MODIFICA 4 — Chiudi app con conferma */
function chiudiApp() {
 if (confirm("Vuoi uscire dall'app?\n\nSe non si chiude automaticamente, chiudi la scheda del browser manualmente.")) {
    window.close();
    setTimeout(() => {
      alert("Il browser non ha permesso la chiusura automatica.\nChiudi manualmente questa scheda.");
    }, 400);
  }
}

  "granchio vivo":"granchio_vivo", "crabe vivant":"granchio_vivo"
};
function slugEsca(nome) {
  const key = nome.toLowerCase().trim();
  if (escaImgSlugs[key]) return escaImgSlugs[key];
  return key.replace(/\s+/g, "_");
}
 function imgFallback(el, testo) {
  const div = document.createElement("div");
  div.className = "img-placeholder";
  if (el.style.height) div.style.height = el.style.height;
  if (el.style.width) div.style.width = el.style.width;
  if (el.style.margin) div.style.margin = el.style.margin;
  div.innerHTML = `<span class="ph-ico">📷</span><span>${testo || "Immagine non disponibile"}</span>`;
  el.replaceWith(div);
}
function mostraEscaPopup(nomeEsca) {
  // Usa la tabella IT/FR già presente nel sistema per trovare il nome reale del file immagine
  const fileNome = slugEsca(nomeEsca);
  // Generazione del percorso standard dell'immagine
  const urlImmagine = `img/${fileNome}.jpg`;
  // Gestione e pulizia del DOM per evitare duplicazioni di popup
  const vecchioPopup = document.getElementById("escaPopup");
  if (vecchioPopup) vecchioPopup.remove();
  const popup = document.createElement("div");
  popup.id = "escaPopup";
  popup.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; z-index:99999; animation:fadeIn 0.2s ease;";
  popup.onclick = function(e) { 
    if (e.target === popup) popup.remove(); 
  };
  popup.innerHTML = `
    <div class="card" style="width:85%; max-width:320px; background:#fff; padding:20px; border-radius:16px; text-align:center; position:relative; box-shadow:0 10px 25px rgba(0,0,0,0.3); animation:scaleUp 0.2s ease; cursor:default;">
      <button onclick="document.getElementById('escaPopup').remove()" style="position:absolute; top:10px; right:12px; background:none; border:none; font-size:18px; cursor:pointer; color:#888;">✕</button>
      <h3 style="margin:0 0 14px 0; font-size:18px; color:#0a2a43;">${nomeEsca}</h3>
      <img src="${urlImmagine}" alt="${nomeEsca}" style="width:100%; max-height:220px; object-fit:contain; border-radius:10px; margin-bottom:10px;"
        onerror="if(typeof imgFallback === 'function'){imgFallback(this,'Immagine non disponibile')}else{this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://w3.org width=%22100%22 height=%22100%22><text y=%2250%%22 x=%2250%%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2212%22 fill=%22%23888%22>Foto non disponibile</text></svg>';}">
    </div>
  `;
  document.body.appendChild(popup);
}
function chiudiEscaPopup(event) {
  const overlay = event.target.closest(".modal-overlay") || document.querySelector(".modal-overlay");
  if (overlay) overlay.remove();
}
function mostraEscaFullscreen(event, img, nome) {
  event.stopPropagation();
  document.body.insertAdjacentHTML("beforeend", `
    <div class="fullscreen-overlay" onclick="chiudiEscaFullscreen(event)">
      <span class="fullscreen-spinner">🎣</span>
      <button class="fullscreen-close" onclick="chiudiEscaFullscreen(event)">✕</button>
      <img src="${img}" alt="${nome}" class="fullscreen-img" onload="this.classList.add('loaded');this.previousElementSibling.previousElementSibling.style.display='none'" onerror="this.previousElementSibling.previousElementSibling.style.display='none';imgFallback(this,'${nome} non disponibile')">
    </div>`);
}

function mostraPescePopup(nomePesce) {
  let urlImmagine = "";
  const nomeTargetCercato = nomePesce.trim().toLowerCase();

  if (typeof specie !== 'undefined') {
    // 1. Prova ricerca esatta sul nome
    for (let key in specie) {
      if (specie[key] && specie[key].nome && specie[key].nome.toLowerCase().trim() === nomeTargetCercato) {
        urlImmagine = specie[key].img;
        break;
      }
    }
    // 2. Prova ricerca sulla chiave (es. specie['sarago-maggiore'])
    if (!urlImmagine) {
      const chiaveGenerata = nomeTargetCercato.replace(/\s+/g, '-');
      if (specie[chiaveGenerata] && specie[chiaveGenerata].img) {
        urlImmagine = specie[chiaveGenerata].img;
      }
    }
    // 3. SUPER RICERCA PARZIALE (Se clicchi "Sarago Maggiore" cerca qualsiasi specie che contenga "sarago")
    if (!urlImmagine) {
      const parole = nomeTargetCercato.split(' ');
      const primaParola = parole[0]; // Prende ad esempio "sarago"
      for (let key in specie) {
        if (specie[key] && specie[key].nome && specie[key].nome.toLowerCase().includes(primaParola)) {
          urlImmagine = specie[key].img;
          break;
        }
      }
    }
  }
  // Fallback se non trova nulla nel database specie
  if (!urlImmagine) {
    const fileNome = nomePesce.trim().toLowerCase().replace(/\s+/g, '-');
    urlImmagine = `img/${fileNome}.jpg`;
  }
  // Generazione Popup Piccolo Bianco
  const vecchioPopup = document.getElementById("pescePopup");
  if (vecchioPopup) vecchioPopup.remove();
  const popup = document.createElement("div");
  popup.id = "pescePopup";
  popup.style = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:9999;animation:fadeIn 0.2s ease;";
  popup.onclick = function(e) { if (e.target === popup) popup.remove(); };
  popup.innerHTML = `
    <div class="card" style="width:85%;max-width:320px;background:#fff;padding:20px;border-radius:16px;text-align:center;position:relative;box-shadow:0 10px 25px rgba(0,0,0,0.3);animation:scaleUp 0.2s ease;cursor:default;">
      <button onclick="document.getElementById('pescePopup').remove()" style="position:absolute;top:10px;right:12px;background:none;border:none;font-size:18px;cursor:pointer;color:#888;">✕</button>
      <h3 style="margin:0 0 14px 0;font-size:18px;color:#0a2a43;">${nomePesce}</h3>
      <img src="${urlImmagine}" alt="${nomePesce}" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-bottom:10px;"
        onerror="if(typeof imgFallback === 'function'){imgFallback(this,'Immagine non disponibile')}else{this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://w3.org width=%22100%22 height=%22100%22><text y=%2250%%22 x=%2250%%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2212%22 fill=%22%23888%22>Foto non disponibile</text></svg>';}">
    </div>
  `;
  document.body.appendChild(popup);
}
function mostraEscaPopup(nomeEsca) {
  const fileNome = slugEsca(nomeEsca);
   // Generiamo un ID univoco temporaneo basato sul tempo per evitare qualsiasi conflitto nel DOM
  const idImmagineUnico = "esca_img_" + Date.now();
  // Rimuove eventuali popup precedenti per non intasare la memoria dell'app
  const vecchioPopup = document.getElementById("escaPopup");
  if (vecchioPopup) vecchioPopup.remove();
  // Creazione del contenitore del popup (quadro bianco piccolo e centrato)
  const popup = document.createElement("div");
  popup.id = "escaPopup";
  popup.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; z-index:99999; animation:fadeIn 0.2s ease;";
  // Chiude il popup se l'utente tocca lo sfondo scuro esterno
  popup.onclick = function(e) { 
    if (e.target === popup) popup.remove(); 
  };
  popup.innerHTML = `
    <div class="card" style="width:85%; max-width:320px; background:#fff; padding:20px; border-radius:16px; text-align:center; position:relative; box-shadow:0 10px 25px rgba(0,0,0,0.3); animation:scaleUp 0.2s ease; cursor:default;">
      <button onclick="document.getElementById('escaPopup').remove()" style="position:absolute; top:10px; right:12px; background:none; border:none; font-size:18px; cursor:pointer; color:#888;">✕</button>
      <h3 style="margin:0 0 14px 0; font-size:18px; color:#0a2a43;">${nomeEsca}</h3>
           <!-- L'immagine parte con il primo percorso standard -->
      <img id="${idImmagineUnico}" src="img/${fileNome}.jpg" alt="${nomeEsca}" style="width:100%; max-height:220px; object-fit:contain; border-radius:10px; margin-bottom:10px;"
        onerror="
          // 🔄 SISTEMA DI RECUPERO PROFESSIONALE (Se il primo tentativo fallisce)
          const imgElement = this;
          const currentSrc = imgElement.src;
                if (currentSrc.indexOf('img/') !== -1 && currentSrc.indexOf('./img/') === -1 && currentSrc.indexOf('/img/') === -1) {
            // Tentativo 2: Forza il percorso relativo esplicito
            imgElement.src = './img/${fileNome}.jpg';
          } else if (currentSrc.indexOf('./img/') !== -1) {
            // Tentativo 3: Forza il percorso dalla radice assoluta
            imgElement.src = '/img/${fileNome}.jpg';
          } else {
            // Fallback finale se il file è corrotto o non è sul server
            if(typeof imgFallback === 'function'){
              imgFallback(imgElement, 'Immagine non disponibile');
            } else {
              imgElement.src = 'data:image/svg+xml;utf8,<svg xmlns=%22http://w3.org width=%22100%22 height=%22100%22><text y=%2250%%22 x=%2250%%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2212%22 fill=%22%23888%22>File non trovato</text></svg>';
            }
          }
        ">
    </div>
  `;
  document.body.appendChild(popup);
}

function updateRegions() {
  const nationSelect = document.getElementById("nation-select");
  const regionSelect = document.getElementById("homeFilterRegion");
  if (!nationSelect || !regionSelect) return;
  const nation = nationSelect.value;
  const data = regionData[nation];
  if (!data) return;
  regionSelect.innerHTML = "";
  Object.keys(data.regions).forEach(region => {
    const option = document.createElement("option");
    option.value = region === "Tutte" ? "ALL" : region;
    option.textContent = region === "Tutte"
  ? (linguaAttuale === "fr" ? "Toutes les régions" : "Tutte le regioni")
  : (linguaAttuale === "fr" ? etichettaRegioneSpot(region) : region);
    regionSelect.appendChild(option);
  });
  if (window.map) {
    window.map.setView(data.center, data.zoom);
  }
  filterSpotsByRegion();
}

function filterSpotsByRegion() {
  const nationSelect = document.getElementById("nation-select");
  const regionSelect = document.getElementById("homeFilterRegion");
  if (!nationSelect || !regionSelect) return;
  const nation = nationSelect.value;
  const region = regionSelect.value;
  const data = regionData[nation];
  if (region !== "ALL" && data && data.regions[region] && window.map) {
    const regInfo = data.regions[region];
    window.map.setView(regInfo.center, regInfo.zoom);
  }
  const allSpotsCombined = [
    ...(typeof spotsData !== 'undefined' ? spotsData : []),
    ...(typeof spotsFranciaData !== 'undefined' ? spotsFranciaData : []),
    ...(typeof spotsTunisiaData !== 'undefined' ? spotsTunisiaData : [])
  ];
  const filteredSpots = allSpotsCombined.filter(spot => {
    const spotNation = (spot.nation || "italia").toLowerCase();
    const matchNation = spotNation === nation.toLowerCase();
    const matchRegion = (region === "ALL") || (spot.region === region);
    return matchNation && matchRegion;
  });
  if (typeof renderSpotList === 'function') renderSpotList(filteredSpots);
  if (typeof updateMapMarkers === 'function') updateMapMarkers(filteredSpots);
}

let currentlyOpenBox = null, currentlyOpenButton = null;
function toggleImageBox(id, imgPath, button) {
  const box = document.getElementById(id); if (!box) return;
  if (currentlyOpenBox && currentlyOpenBox !== box) {
    currentlyOpenBox.classList.remove("open"); currentlyOpenBox.innerHTML = "";
    if (currentlyOpenButton) currentlyOpenButton.classList.remove("active");
  }
  if (box.classList.contains("open")) {
    box.classList.remove("open"); box.innerHTML = "";
    button.classList.remove("active"); currentlyOpenBox = null; currentlyOpenButton = null; return;
  }
 if (box.innerHTML === "") {
    const img = document.createElement("img");
    img.src = imgPath;
    img.className = "img-box-bg";
    img.style.cssText = "width:100%;max-width:260px;height:180px;object-fit:contain;border-radius:12px;margin-top:10px;display:block;cursor:zoom-in;";
    img.onclick = (e) => mostraEscaFullscreen(e, imgPath, "Schema montatura");
    img.onerror = function() { imgFallback(this, "Schema non disponibile"); };
    box.appendChild(img);
    const hint = document.createElement("p");
    hint.style.cssText = "text-align:center;font-size:10px;opacity:0.5;margin:4px 0 0;";
    hint.textContent = "🔍 Tocca per ingrandire";
    box.appendChild(hint);
  }
  box.classList.add("open"); button.classList.add("active");
  setTimeout(() => box.scrollIntoView({ behavior:"smooth", block:"center" }), 200);
  currentlyOpenBox = box; currentlyOpenButton = button;
}
function generaListaCliccabile(lista) {
  let html = "<div class='mini-container'>";

   const safeId = "img-" + item.nome.replace(/[^a-zA-Z0-9]/g,"_") + "-" + index;
    html += `<div class="mini-card" onclick="toggleImgById('${safeId}')">${item.nome}<div id="${safeId}" style="display:none;margin-top:8px;text-align:center;"><img src="${item.img}" onclick="event.stopPropagation();mostraEscaFullscreen(event,'${item.img}','${item.nome}')" class="img-box-bg" style="width:100%;max-width:260px;height:180px;object-fit:contain;border-radius:12px;cursor:zoom-in;" onerror="imgFallback(this,'${item.nome} non disponibile')"><p style="font-size:10px;opacity:0.5;margin:4px 0 0;">🔍 Tocca per ingrandire</p></div></div>`;

}
function toggleImgById(id) {
  const el = document.getElementById(id); if (!el) return;
  const aperto = el.style.display === "block";

function apriDettaglio(tipo, index) {
  const container=document.getElementById(tipo+"-detail"); if(!container)return;
  const parti=tipo.split("-"); if(parti.length<2)return;
  const tecnica=parti[0]; const categoria=parti.slice(1).join("-");
  const categoriaLingua = categoria + (linguaAttuale === "fr" ? "Fr" : "It");
  if(!tecnicheData[tecnica]||!tecnicheData[tecnica][categoriaLingua])return;
  const item=tecnicheData[tecnica][categoriaLingua][index]; if(!item)return;
  if(container.dataset.open==index){container.innerHTML="";container.dataset.open="";return;}

  return html+"</div></div>";
}

  if (!navigator.geolocation) {
    // Se il browser non supporta il GPS, carica la capitale via internet

    return;
  }
  navigator.geolocation.getCurrentPosition(

      prevCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };

async function caricaPrevisioni(lat, lon, usaFallback = false) {

function initMappaEsplorazioneNuova() {
  let centroMappa = [42.0, 12.5];
  let zoomIniziale = 6;
  let listaSpot = (typeof spotsItalia !== 'undefined' ? spotsItalia : []);
  let nomeNazione = linguaAttuale === "fr" ? "Italie" : "Italia";
  if (nazioneAttiva === "fr") {
    centroMappa = [46.5, 2.0];
    zoomIniziale = 5.5;
    listaSpot = Array.isArray(spotsFranceExternal) ? spotsFranceExternal : [];
    nomeNazione = linguaAttuale === "fr" ? "France" : "Francia";
  } else if (nazioneAttiva === "tn") {
    centroMappa = [35.5, 9.5];
    zoomIniziale = 7;
    listaSpot = (Array.isArray(spotsTunisiaExternal) ? spotsTunisiaExternal : [])
      .map(normalizzaSpotTunisia);
    nomeNazione = linguaAttuale === "fr" ? "Tunisie" : "Tunisia";
  }
  document.getElementById("nomeNazioneBadge").textContent = nomeNazione;
  // Reset Leaflet
  if (spotItaliaMap !== null) {
    try {
      spotItaliaMap.remove();
    } catch(e) {
      console.log("Reset mappa eseguito");
    }
    spotItaliaMap = null;
  }
  spotItaliaMarkers = [];
  spotItaliaMap = L.map('spotItaliaMap', {
    zoomControl: true,
    scrollWheelZoom: false,
    touchZoom: false,
    doubleClickZoom: false
  }).setView(centroMappa, zoomIniziale);
  const mapEl = document.getElementById('spotItaliaMap');
  if (mapEl) mapEl.style.touchAction = 'pan-y';
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(spotItaliaMap);
  renderizzaListaEMappe(listaSpot);
}
function renderizzaListaEMappe(listaSpot) {
  // Pulizia vecchi marker
  if (spotItaliaMarkers && spotItaliaMarkers.length > 0) {
    spotItaliaMarkers.forEach(m => {
      if (spotItaliaMap && spotItaliaMap.hasLayer(m)) {
        spotItaliaMap.removeLayer(m);
      }
    });
  }
  spotItaliaMarkers = [];
  const panelBody = document.getElementById("listaSpotEsplorazione");
  if (!panelBody) return;
  panelBody.innerHTML = "";
  if (!listaSpot || listaSpot.length === 0) {
    panelBody.innerHTML = `
      <div class="spot-panel-placeholder">
        <span class="ph-ico">🎣</span>
        <p>${t("nessunSpotZona")}</p>
      </div>
    `;
    return;
  }
  listaSpot.forEach((spot) => {
    // Coordinate compatibili con entrambi i formati
    const spotLat = Number(
      spot.lat ??
      spot.latitude ??
      spot.coords?.[0]
    );
    const spotLon = Number(
      spot.lon ??
      spot.lng ??
      spot.longitude ??
      spot.coords?.[1]
    );
    if (!Number.isFinite(spotLat) || !Number.isFinite(spotLon)) {
      return;
    }
    // Normalizza temporaneamente le coordinate
    // così il sistema nuovo può usare sempre spot.coords
    if (!spot.coords) {
      spot.coords = [spotLat, spotLon];
    }
    // Marker
if (spotItaliaMap) {
  const marker = L.marker([spotLat, spotLon])
    .addTo(spotItaliaMap);
  spotItaliaMarkers.push(marker);
  // Click sul marker = apre il dettaglio completo
  marker.on("click", () => {
    onSpotSelezionato(spot);
  });
}
    // Voce lista
    const item = document.createElement("div");
    item.className =
      "spot-italia-item" +
      (spotAttivo === spot ? " active" : "");
    item.innerHTML = `
      <span class="si-ico">🎣</span>
      <div class="si-info">
        <div class="si-nome">
          ${spot.name || spot.nome || "Spot"}
        </div>
        <div class="si-sub">
          🐟 ${spot.target || "Varie specie"}
        </div>
      </div>
      <span class="si-badge">
        ${spot.type || spot.technique || "Spot"}
      </span>
    `;
    // Click lista = stesso identico dettaglio del marker
    item.onclick = () => {
      onSpotSelezionato(spot);
    };
    panelBody.appendChild(item);
  });
}

function calcolaConsiglioCompleto(ondaM,ventoKmh,ora,wCode){

function generaGiorni(marine,meteo,ora){

    const tMax=meteo.daily?.temperature_2m_max?.[i]??"--",tMin=meteo.daily?.temperature_2m_min?.[i]??"--";

/* MODIFICA 3 — Esporta e Importa JSON */
function esportaSpot() {
  const spots = caricaSpot();
  if (spots.length === 0) { alert("Nessuno spot da esportare."); return; }
  const json = JSON.stringify(spots, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "miei-spot-pesca.json";
  a.click();
  URL.revokeObjectURL(url);
}
function importaSpot(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const importati = JSON.parse(e.target.result);
      if (!Array.isArray(importati)) { alert("File non valido."); return; }
      const esistenti = caricaSpot();
      const idEsistenti = new Set(esistenti.map(s => s.id));
      const nuovi = importati.filter(s => !idEsistenti.has(s.id));
      const tutti = [...nuovi, ...esistenti];
      salvaSpot(tutti);
      document.getElementById("spotList").innerHTML = renderSpotList(tutti);
      alert(`✅ Importati ${nuovi.length} spot (${importati.length - nuovi.length} già presenti ignorati).`);
    } catch(err) { alert("Errore nella lettura del file JSON."); }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function normalizzaTestoSpot(v){
  return String(v||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function regioneSpotCorrisponde(spot, regioneFiltro){
  if(!regioneFiltro || normalizzaTestoSpot(regioneFiltro) === "all") return true;
  const r = normalizzaTestoSpot(spot.reg || spot.region || spot.regione || "");
  const f = normalizzaTestoSpot(regioneFiltro);
  if(r === f) return true;
  const alias = {
    // Francia
    "paca / cote d'azur": ["costa azzurra","paca","cote d'azur"],
    "bretagne": ["bretagna","bretagne"],
    "occitanie": ["occitania","occitanie"],
    "nouvelle-aquitaine": ["aquitania","nouvelle-aquitaine"],
    "normandie": ["normandia","normandie"],
    "corse": ["corsica","corse"],
    // Tunisia: accetta sia il nome visualizzato sia quello del JSON
    "biserta": ["biserta","bizerte"],
    "bizerte": ["biserta","bizerte"],
    "cap bon": ["cap bon","cap bon / nabeul"],
    "cap bon / nabeul": ["cap bon","cap bon / nabeul"],
    "tunisi": ["tunisi","tunis","tunis / ghar el melh"],
    "tunis / ghar el melh": ["tunisi","tunis","tunis / ghar el melh"],
    "sousse / sahel": ["sousse / sahel","sousse","sahel"],
    "djerba": ["djerba"],
    "medenine": ["medenine"],
    "gabes": ["gabes"],
    "gabs": ["gabs"],
    "gabès": ["gabès"]
  };
  return (alias[f] || []).some(a => r === normalizzaTestoSpot(a));

function normalizzaSpotTunisia(spot){
  if(!spot || typeof spot !== "object") return spot;
  const lat = Number(spot.lat ?? spot.latitude ?? spot.coords?.[0]);
  const lon = Number(spot.lon ?? spot.lng ?? spot.longitude ?? spot.coords?.[1]);
  if(Number.isFinite(lat) && Number.isFinite(lon) && !spot.coords){
    spot.coords = [lat, lon];
  }
  return spot;
}
function tecnicaSpotCorrisponde(spot, tecnicaFiltro){
  if(!tecnicaFiltro || tecnicaFiltro === "all") return true;
  const testo = normalizzaTestoSpot(
    spot.type || spot.technique || spot.tecnica || ""
  );
  const f = normalizzaTestoSpot(tecnicaFiltro);
  if(!f) return true;
  if(f === "bolognese"){
    return testo.includes("bolognese");
  }
  if(f === "fondo"){
    return testo.includes("fondo");
  }
  return testo.includes(f);
}

    spotTooltipAttivo=L.marker(spot.coords,{icon:icoVuota,zIndexOffset:1000}).addTo(spotItaliaMap)
      .bindTooltip(`<b>${spot.name || spot.nome || "Spot"}</b>`,{permanent:true,direction:'top',offset:[0,-8],className:'spot-tooltip-label'}).openTooltip();
  }
  mostraDettaglioPannello(spot);
  if(isMobile()){
    document.getElementById("spotModalLista")?.remove();
    setTimeout(()=>{const panel=document.getElementById("spotPanelRight");if(panel)panel.scrollIntoView({behavior:"smooth",block:"start"});},300);
  }
  document.querySelectorAll(".spot-italia-item").forEach(el=>el.classList.remove("active"));
  document.querySelectorAll(".spot-italia-item").forEach(el=>{if(el.querySelector(".si-nome")?.textContent===spot.name)el.classList.add("active");});
}
/* === DETTAGLIO SPOT + SALVATAGGIO === */
function mostraDettaglioPannello(spot) {
  const header = document.getElementById("spotPanelHeader");
  const body = document.getElementById("spotPanelBody");
  if (!header || !body) return;
  const nome = spot.name || spot.nome || "Spot";
  const regione = spot.reg || spot.region || spot.regione || "Italia";
  const tecnica = spot.type || spot.technique || spot.tecnica || "Non specificata";
  const target = spot.target || "Varie specie";
  const tips = spot.tips || spot.description || spot.desc || "";
  const lat = Number(spot.lat ?? spot.coords?.[0]);
  const lon = Number(spot.lon ?? spot.lng ?? spot.coords?.[1]);
  header.textContent = "📍 " + regione;
  // ID sicuro basato sullo spot, non sull'indice dell'array
  const spotId = encodeURIComponent(nome);
  window.__spotItaliaDettaglio = spot;
  body.innerHTML = `
  <div class="spot-detail-panel">
  <span class="sdp-tag">📍 ${etichettaRegioneSpot(regione)}</span>
  <h3 class="sdp-title">${nome}</h3>
      <div class="spot-detail-grid">
        <div class="spot-detail-cell">
          <div class="sdc-lbl">${t("tecnicaCampo")}</div>
          <div class="sdc-val">${tecnica}</div>
        </div>
        <div class="spot-detail-cell">
          <div class="sdc-lbl">${t("target")}</div>
          <div class="sdc-val">${target}</div>
        </div>
      </div>
      <div class="spot-detail-tips">
        <p>💡 ${tips}</p>
      </div>
      ${
        Number.isFinite(lat) && Number.isFinite(lon)
        ? `
        <button
          class="btn-nav-spot"
          onclick="window.open('https://www.google.com/maps?q=${lat},${lon}','_blank')">
          ${t("ottieniIndicazioni")}
        </button>
        `
        : ""
      }
      <button
        class="btn-salva-spot-italia"
        id="btnSalvaItalia_${spotId}"
        onclick="salvaSpotItalia(window.__spotItaliaDettaglio)">
        ${t("salvaNeiMieiSpot")}
      </button>
      <button
        class="btn-back-lista"
        onclick='tornaListaRegione(${JSON.stringify(regione)})'>
        ${t("tuttiGliSpotDi")} ${etichettaRegioneSpot(regione)}
      </button>
    </div>
  `;
  // Aggiorna subito lo stato del pulsante
  aggiornaLabelSalva(spot);
}
/* === SALVA SPOT ITALIA === */
function salvaSpotItalia(spot) {
  if (!spot) return;
  const nome = spot.name || spot.nome || "Spot";
  const target = spot.target || "Varie specie";
  const tecnica =
    spot.type ||
    spot.technique ||
    spot.tecnica ||
    "Non specificata";
  const tips =
    spot.tips ||
    spot.description ||
    spot.desc ||
    "";
  const lat = Number(
    spot.lat ??
    spot.coords?.[0]
  );
  const lon = Number(
    spot.lon ??
    spot.lng ??
    spot.coords?.[1]
  );
  const spots = caricaSpot();
  const fonteCorrente = nazioneAttiva === "tn" ? "tunisia" : nazioneAttiva === "fr" ? "francia" : "italia";
  const giaSalvato = spots.find(
    s =>
      s.fonte === fonteCorrente &&
      s.nome === nome
  );
  if (giaSalvato) {
    alert(
      "Spot già salvato nei tuoi spot! Puoi trovarlo nella sezione Meteo."
    );
    return;
  }
  const nuovoSpot = {
    id: Date.now(),
    nome: nome,
    specie: target,
    montatura: tecnica,
    note: String(tips).slice(0, 80),
    lat: lat,
    lon: lon,
    data: new Date().toLocaleDateString("it-IT"),
    fonte: fonteCorrente
  };
  spots.unshift(nuovoSpot);
  salvaSpot(spots);
  aggiornaLabelSalva(spot);
  alert(
    "✅ Spot salvato! Trovi tutti i tuoi spot nella sezione Meteo."
  );
}
/* === AGGIORNA PULSANTE SALVATAGGIO === */
function aggiornaLabelSalva(spot) {
  if (!spot) return;
  const nome = spot.name || spot.nome || "Spot";
  const spotId = encodeURIComponent(nome);
  const btn = document.getElementById(
    "btnSalvaItalia_" + spotId
  );
  if (!btn) return;
  const spots = caricaSpot();
  const fonteCorrente = nazioneAttiva === "tn" ? "tunisia" : nazioneAttiva === "fr" ? "francia" : "italia";
  const giaSalvato = spots.find(
    s =>
      s.fonte === fonteCorrente &&
      s.nome === nome
  );
  if (giaSalvato) {
    btn.textContent = t("giaSalvato");
    btn.style.opacity = "0.6";
    btn.style.cursor = "default";
    btn.onclick = null;
  }
}
/* === TORNA ALLA LISTA DELLA REGIONE === */
function tornaListaRegione(reg) {
  const sorgente = nazioneAttiva === "fr" ? spotsFranceExternal :
                   nazioneAttiva === "tn" ? spotsTunisiaExternal : spotsItalia;
  const lista = sorgente.filter(s => regioneSpotCorrisponde(s, reg));
  lista.forEach(s => {
    if (!s.coords) {
      const lat = Number(s.lat ?? s.latitude);
      const lon = Number(s.lon ?? s.lng ?? s.longitude);
      if (Number.isFinite(lat) && Number.isFinite(lon)) s.coords = [lat, lon];
    }
  });
  mostraPannelloLista(lista, reg);
  aggiornaMappaSpotItalia(lista);
  if (lista.length > 0) {
    const coords = lista.map(s => s.coords).filter(c => Array.isArray(c) && c.length >= 2);
    const bounds = L.latLngBounds(coords);
    if (bounds.isValid()) {
      spotItaliaMap.fitBounds(bounds, {
        padding: [30, 30],
        maxZoom: 9
      });
    }
  }
  const n = lista.length;
  if (document.getElementById("spotCount")) {
    document.getElementById("spotCount").textContent =
      n + " spot";
  }
  if (document.getElementById("mappaSpotCount")) {
    document.getElementById("mappaSpotCount").textContent =
      n + " visibili";
  }
}

<!-- ============================================================
     BLOCCO JS — QUANDO PESCARE (Solunar + Maree + Luna)
     ============================================================ -->
<script>
/* === QUANDO PESCARE OGGI === */
function showQuandoPescare() {
  document.getElementById("content").innerHTML = `
    <div class="qp-loader">
      <span class="spinner">🌙</span>
      <p>${t('calcoloCondizioni')}</p>
    </div>`;
  if (!navigator.geolocation) {
    renderQuandoPescare(41.9, 12.5); return;
  }
  const usa = confirm(t('confermaGPS'));

    pos => renderQuandoPescare(pos.coords.latitude, pos.coords.longitude),

  );
}
async function renderQuandoPescare(lat, lon) {

    const dati = await res.json();
    mareeOggi = calcolaMareeDaHourly(dati.hourly?.sea_level_height_msl || [], dati.hourly?.time || []);
  } catch(e) { 
    mareeOggi = []; 
  }
  const lunaInfo   = calcolaFaseLuna(ora);
  const solunar    = calcolaSolunar(lat, lon, ora);
  const giorniHTML = generaGiorniSolunar(lat, lon, ora);
  const ratingGiorno = calcolaRatingSolunar(lunaInfo.illuminazione, ora);
  const localeStr = linguaAttuale === "fr" ? "fr-FR" : "it-IT";
  const ratingLabels = linguaAttuale === "fr" ? ["","Faible","Basse","Correcte","Bonne","Excellente"] : ["","Scarsa","Bassa","Discreta","Buona","Ottima"];
  document.getElementById("content").innerHTML = `
    <div class="qp-hero">

      <span class="qp-luna-ico">${lunaInfo.icona}</span>
      <div class="qp-luna-nome">${lunaInfo.fase}</div>
      <div class="qp-luna-pct">${t('illuminazioneLabel')} ${lunaInfo.illuminazione}%</div>
      <div class="qp-rating-bar">

            <div class="sf-ora">${s.ora}</div>
            <div class="sf-dur">${s.tipo === "major" ? t('circaOre') : t('circaUnOra')}</div>
          </div>`).join("")}
      </div>

      </p>
    </div>

      <h3>${t('mareeOggi')}</h3>
      ${mareeOggi.length > 0 ? mareeOggi.map(m=>`
        <div class="marea-row">
          <span class="marea-ico">${m.tipo === "alta" ? "⬆️" : "⬇️"}</span>
          <div class="marea-info">
            <div class="marea-tipo">${m.tipo === "alta" ? t('mareaAlta') : t('mareaBassa')}</div>
            <div class="marea-ora">${m.ora}</div>

          <div class="marea-h">${m.altezza} m</div>
        </div>`).join("") :
        `<p style="opacity:0.5;font-size:13px;text-align:center;padding:10px 0;">
          ${t('mareeNonDisponibili')}<br>
          <small>${t('mareeSoloMareAperto')}</small>
        </p>`}
    </div>
    <div class="qp-card">

      ${generaConsiglioPesca(lunaInfo, solunar, ora)}

    <button onclick="goTo(showQuandoPescare)" style="width:100%;">${t('aggiornaBtn')}</button><br>`;
}
/* ── CALCOLO FASE LUNA ── */
function calcolaFaseLuna(data) {
  const riferimento = new Date("2000-01-06T18:14:00Z");
  const diffGiorni  = (data - riferimento) / 86400000;
  const ciclo       = 29.53059;
  const etaLuna     = ((diffGiorni % ciclo) + ciclo) % ciclo;
  const illuminazione = Math.round(50 * (1 - Math.cos(2 * Math.PI * etaLuna / ciclo)));
  const isFr = linguaAttuale === "fr";
  let fase, icona;
  if      (etaLuna < 1.85)  { fase=isFr?"Nouvelle Lune":"Luna Nuova";        icona="🌑"; }
  else if (etaLuna < 7.38)  { fase=isFr?"Premier Croissant":"Quarto Crescente";  icona="🌒"; }
  else if (etaLuna < 9.22)  { fase=isFr?"Premier Quartier":"Primo Quarto";      icona="🌓"; }
  else if (etaLuna < 14.77) { fase=isFr?"Gibbeuse Croissante":"Gibbosa Crescente"; icona="🌔"; }
  else if (etaLuna < 16.61) { fase=isFr?"Pleine Lune":"Luna Piena";        icona="🌕"; }
  else if (etaLuna < 22.15) { fase=isFr?"Gibbeuse Décroissante":"Gibbosa Calante";   icona="🌖"; }
  else if (etaLuna < 23.99) { fase=isFr?"Dernier Quartier":"Ultimo Quarto";     icona="🌗"; }
  else if (etaLuna < 29.53) { fase=isFr?"Dernier Croissant":"Quarto Calante";    icona="🌘"; }
  else                       { fase=isFr?"Nouvelle Lune":"Luna Nuova";       icona="🌑"; }
  return { fase, icona, illuminazione, etaLuna };
}
/* ── CALCOLO SOLUNAR ── */
function calcolaSolunar(lat, lon, data) {
  const JD = dataToJD(data);
  const risultati = [];
  /* Transiti lunari: luna al meridiano e anti-meridiano */
  const trasitoPrincipale = calcolaTransitoLuna(JD, lon);
  const trasitoOposto = (trasitoPrincipale + 12 * 3600000) % 86400000;
  /* Alba e tramonto luna (minor periods) */
  const albeLuna = calcolaAlbaTramonto(JD, lat, lon, "luna");
  const fasce = [
    { ms: trasitoPrincipale,   tipo:"major", ico:"🌕" },
    { ms: trasitoOposto,       tipo:"major", ico:"🌑" },
    { ms: albeLuna.alba,       tipo:"minor", ico:"🌙" },
    { ms: albeLuna.tramonto,   tipo:"minor", ico:"🌛" },
  ];
  fasce.sort((a,b) => a.ms - b.ms);
  return fasce.map(f => ({
    tipo: f.tipo,
    ico:  f.ico,
    ora:  msToOra(f.ms)
  }));
}
function dataToJD(data) {
  return data.getTime() / 86400000 + 2440587.5;
}
function calcolaTransitoLuna(JD, lon) {
  /* Anomalia media della luna */
  const T  = (JD - 2451545.0) / 36525;
  const L0 = (218.3164477 + 481267.88123421 * T) % 360;
  const M  = (134.9633964 + 477198.8675055  * T) % 360;
  const Mrad = M * Math.PI / 180;
  const lambda = L0 + 6.289 * Math.sin(Mrad);
  /* Ora del transito in ms dal mezzanotte locale */
  const raLuna = ((lambda % 360) + 360) % 360;
  const oraDecimale = (raLuna / 15 - lon / 15 + 24) % 24;
  return Math.round(oraDecimale * 3600000);
}
function calcolaAlbaTramonto(JD, lat, lon, corpo) {
  /* Approssimazione alba/tramonto luna */
  const T = (JD - 2451545.0) / 36525;
  const M = (134.9633964 + 477198.8675055 * T) * Math.PI / 180;
  const L = (218.3164477 + 481267.88123421 * T) * Math.PI / 180;
  const dec = Math.asin(Math.sin(0.0898) * Math.sin(L + 0.1098 * Math.sin(M)));
  const latRad = lat * Math.PI / 180;
  const cosH = -Math.tan(latRad) * Math.tan(dec);
  const H = cosH >= 1 ? 0 : cosH <= -1 ? Math.PI : Math.acos(cosH);
  const HDeg = H * 180 / Math.PI;
  const transito = ((218.3164477 + 481267.88123421 * T) / 15 - lon / 15 + 24) % 24;
  const alba     = ((transito - HDeg / 15) + 24) % 24;
  const tramonto = ((transito + HDeg / 15) + 24) % 24;
  return {
    alba:     Math.round(alba     * 3600000),
    tramonto: Math.round(tramonto * 3600000)
  };
}
function msToOra(ms) {
  const tot = ((ms % 86400000) + 86400000) % 86400000;
  const h   = Math.floor(tot / 3600000);
  const m   = Math.floor((tot % 3600000) / 60000);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}
/* ── RATING SOLUNAR GIORNALIERO ── */
function calcolaRatingSolunar(illuminazione, data) {
  let r = 3;
  if (illuminazione > 85 || illuminazione < 10) r = 5;      /* Luna piena o nuova */
  else if (illuminazione > 65 || illuminazione < 25) r = 4;
  else if (illuminazione > 45 && illuminazione < 55) r = 3;
  /* Bonus weekend */
  const g = data.getDay();
  return Math.min(5, r);
}
/* ── MAREE DA HOURLY ── */
function calcolaMareeDaHourly(valori, tempi) {
  if (!valori || valori.length === 0) return [];
  const maree = [];
  for (let i = 1; i < valori.length - 1; i++) {
    const prev = valori[i-1], curr = valori[i], next = valori[i+1];
    if (curr === null || prev === null || next === null) continue;
    const isAlta  = curr > prev && curr > next;
    const isBassa = curr < prev && curr < next;
    if (isAlta || isBassa) {
      const ora = tempi[i] ? tempi[i].slice(11,16) : "--:--";
      maree.push({
        tipo:    isAlta ? "alta" : "bassa",
        ora,
        altezza: curr.toFixed(2)
      });
    }
  }
  return maree.slice(0, 4);
}
/* ── GIORNI SOLUNAR SCROLL ── */
function generaGiorniSolunar(lat, lon, ora) {
  const giorniIt = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
  const giorniFr = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
  const giorni = linguaAttuale === "fr" ? giorniFr : giorniIt;
  const domaniLabel = linguaAttuale === "fr" ? "Demain" : "Domani";
  let html = "";
  for (let i = 1; i <= 3; i++) {
    const d = new Date(ora); d.setDate(d.getDate() + i);
    const nome  = i === 1 ? domaniLabel : giorni[d.getDay()];
    const luna  = calcolaFaseLuna(d);
    const rating = calcolaRatingSolunar(luna.illuminazione, d);
    const sol   = calcolaSolunar(lat, lon, d);
    const major1 = sol.filter(s=>s.tipo==="major")[0];
    html += `
      <div class="qp-giorno-card">
        <div class="qgc-nome">${nome}</div>
        <div class="qgc-luna">${luna.icona}</div>
        <div class="qgc-fase">${luna.fase.split(" ").slice(0,2).join(" ")}</div>
        <div class="qgc-rate">${stelleRating(rating)}</div>
        ${major1 ? `<div class="qgc-major">⭐ ${major1.ora}</div>` : ""}
      </div>`;
  }
  return html;
}
/* ── CONSIGLIO TESTO ── */
function generaConsiglioPesca(luna, solunar, ora) {
  const h = ora.getHours();
  const isFr = linguaAttuale === "fr";
  const major = solunar.filter(s=>s.tipo==="major");
  const prossimo = solunar.find(s => {
    const [hh,mm] = s.ora.split(":").map(Number);
    return (hh * 60 + mm) > (h * 60 + ora.getMinutes());
  });
  let consiglio = "";
  const ill = luna.illuminazione;
  if (isFr) {
    if (ill > 85)       consiglio += "<b>🌕 Pleine Lune</b> — période dorée pour la pêche. Les poissons sont actifs toute la journée, surtout la nuit. Idéal pour bars et sars. ";
    else if (ill < 10)  consiglio += "<b>🌑 Nouvelle Lune</b> — excellent pour la pêche diurne. Les eaux sombres la nuit rendent les appâts plus visibles. Parfait pour la pêche au fond. ";
    else if (ill > 60)  consiglio += "<b>🌔 Lune croissante</b> — bonnes conditions. Les poissons ont tendance à s'alimenter davantage. ";
    else                consiglio += "<b>🌘 Lune décroissante</b> — conditions moyennes. Concentrez-vous sur les périodes major. ";
    if (prossimo) {
      consiglio += `Le prochain moment <b>${prossimo.tipo === "major" ? "⭐ MAJOR" : "● minor"}</b> est à <b>${prossimo.ora}</b>. `;
      if (prossimo.tipo === "major") consiglio += "Préparez-vous à l'avance et gardez la canne en main !";
      else consiglio += "Peut donner de bons résultats, surtout aux premières et dernières heures de lumière.";
    } else {
      consiglio += "Les meilleurs moments d'aujourd'hui sont déjà passés. Planifiez votre sortie de demain !";
    }
  } else {
    if (ill > 85)       consiglio += "<b>🌕 Luna Piena</b> — periodo d'oro per la pesca. I pesci sono attivi tutto il giorno, specialmente di notte. Ideale per spigole e saraghi. ";
    else if (ill < 10)  consiglio += "<b>🌑 Luna Nuova</b> — eccellente per la pesca diurna. Le acque scure di notte rendono le esche più visibili. Ottimo per pesca a fondo. ";
    else if (ill > 60)  consiglio += "<b>🌔 Luna in crescita</b> — buone condizioni. I pesci tendono ad alimentarsi di più. ";
    else                consiglio += "<b>🌘 Luna calante</b> — condizioni nella media. Concentrati sui periodi major. ";
    if (prossimo) {
      consiglio += `Il prossimo momento <b>${prossimo.tipo === "major" ? "⭐ MAJOR" : "● minor"}</b> è alle <b>${prossimo.ora}</b>. `;
      if (prossimo.tipo === "major") consiglio += "Preparati con anticipo e tieni la canna in mano!";
      else consiglio += "Può dare buoni risultati, specialmente nelle prime e ultime ore di luce.";
    } else {
      consiglio += "I momenti migliori per oggi sono già passati. Pianifica l'uscita di domani!";
    }
  }
  return `<p style="font-size:13px;line-height:1.8;margin:0;">${consiglio}</p>`;
}
</script>
<script>
/* === AVVIO === */
async function avviaApp() {
  const linguaSalvata = localStorage.getItem("lingua") || "it";
  const fileNodi = linguaSalvata === "fr" ? "./data/nodi.fr.json" : "./data/nodi.json";
  const fileMontature = linguaSalvata === "fr" ? "./data/montature.fr.json" : "./data/montature.json";
  const fileSpecie = linguaSalvata === "fr" ? "./data/specie.fr.json" : "./data/specie.json";
   try {
    const [resNodi, resMontature, resSpecie, resSpot, resSpotFrancia, resSpotTunisia] = await Promise.all([
  fetch(fileNodi).catch(() => null),
  fetch(fileMontature).catch(() => null),
  fetch(fileSpecie).catch(() => null),
  fetch("./data/spot-italia.json").catch(() => null),
  fetch("./data/spot-francia.json").catch(() => null),
  fetch("./data/spot-tunisia.json").catch(() => null)
]);
    if (resNodi && resNodi.ok) nodiData = await resNodi.json();
    if (resMontature && resMontature.ok) montatureData = await resMontature.json();
    if (resSpecie && resSpecie.ok) specie = await resSpecie.json();
    if (resSpot && resSpot.ok) spotsItalia = await resSpot.json();
    if (resSpotFrancia && resSpotFrancia.ok) spotsFranceExternal = await resSpotFrancia.json();
    if (resSpotTunisia && resSpotTunisia.ok) {
      const datiTunisia = await resSpotTunisia.json();
      spotsTunisiaExternal = Array.isArray(datiTunisia)
        ? datiTunisia.map(normalizzaSpotTunisia)
        : [];
    }
  } catch(e) {
    console.error("Errore caricamento dati locali:", e);
  }
  // Esegue le funzioni di configurazione iniziale dello stato
  caricaTema();
  caricaLingua();
  showHome();
}
// Dichiarazione della funzione che mancava e causava il blocco in console
function caricaTema() {
  try {
    var temaSalvato = localStorage.getItem("temaAttivo") || "light";
    document.documentElement.setAttribute("data-theme", temaSalvato);
    console.log("Tema grafico configurato:", temaSalvato);
  } catch(e) {
    console.log("Impossibile caricare le preferenze del tema, uso default light");
  }
}
// Inizializzazione ufficiale del ciclo di vita dell'applicazione
avviaApp();
// Gestione temporizzata della scomparsa dello Splash Screen grafico
window.addEventListener("load", function() {
  setTimeout(function() {
    var s = document.getElementById("splash");
    if (s) { s.style.display = "none"; }
  }, 3500);
});
</script>
<script>
// Registrazione del Service Worker per il supporto offline (PWA)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./sw.js").catch(function(err) {
      console.log("Service Worker non registrato:", err);
    });
  });
}
 // Funzione ausiliaria per formattare il testo (\n -> <br> e ** -> <strong>)
function formattaTestoGuida(testo) {
  if (!testo) return 'Nessun contenuto disponibile / Aucun contenu disponible.';
  return testo
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Converte **grassetti**
    .replace(/\n/g, '<br>');                           // Converte i ritorni a capo
}
// Funzione per caricare la guida tecnica esperta dal file JSON (Rileva la lingua in automatico)
async function caricaGuidaMontatura(idMontatura) {
  // Rileva la lingua globale dell'app (cambia in 'currentLang' se usi quel nome per la variabile)
  const lang = typeof linguaAttuale !== 'undefined' ? linguaAttuale : 'it'; 
  const suffissoLingua = lang === 'fr' ? '.fr' : '';
   try {
    // Carica il file italiano (.json) o francese (.fr.json) dalla tua cartella dedicata
    const response = await fetch(`./data/guide_montature/${idMontatura}${suffissoLingua}.json`);
    if (!response.ok) {
      throw new Error(`File non trovato (Status: ${response.status})`);
    }
    const data = await response.json();
    mostraMenuCapitoli(data);
  } catch (error) {
    console.error("Errore nel caricamento della guida:", error);
    const container = document.getElementById("contenitore-guida");
    if (container) {
      // Testo dinamico in caso di errore di caricamento preso dal dizionario
      const msgErrore = lang === 'fr' ? "Guide en cours d'arrivée per questa montatura !" : "Guida in arrivo per questa montatura !";
      container.innerHTML = `<p style="color:red;padding:10px;text-align:center;font-weight:bold;">${msgErrore}</p>`;
    }
  }
}
// Mostra i 6 capitoli tra cui scegliere
function mostraMenuCapitoli(guidaData) {
  const container = document.getElementById("contenitore-guida");
  if (!container) return;
  const lang = typeof linguaAttuale !== 'undefined' ? linguaAttuale : 'it';
  // Gestione dinamica del titolo per eliminare i residui italiani nel JSON francese
  let titoloPulito = guidaData.titolo;
  let suffissoTitolo = ' - Guida Tecnica Esperta';
   if (lang === 'fr') {
    suffissoTitolo = ' - Guide Technique Experte';
    // Sostituisce i prefissi italiani con il termine corretto francese "Montage"
    titoloPulito = titoloPulito
      .replace(/^Montatura a /i, 'Montage ')
      .replace(/^Montatura con /i, 'Montage avec ')
      .replace(/^Montatura /i, 'Montage ');
  }
  let html = `<h3 style="margin-top:15px;color:#0a2a43;">${titoloPulito}${suffissoTitolo}</h3>`;
  html += `<div style="display:flex;flex-direction:column;gap:8px;">`;
  
  guidaData.capitoli.forEach((capitolo, index) => {
    html += `
      <button onclick="apriCapitolo('${guidaData.id}', ${index})" style="padding:10px;border-radius:8px;border:1px solid #a8d8ea;background:#f4f9fc;text-align:left;cursor:pointer;">
        <strong style="display:block;color:#0a2a43;">${capitolo.titolo}</strong>
        <small style="color:#555;">${capitolo.sottotitolo}</small>
      </button>
    `;
  });
  html += `</div>`;
  container.innerHTML = html;
}
// Mostra il dettaglio del singolo capitolo con il tasto indietro
async function apriCapitolo(idMontatura, indiceCapitolo) {
  const container = document.getElementById("contenitore-guida");
  if (!container) return;

  const lang = typeof linguaAttuale !== 'undefined' ? linguaAttuale : 'it';
  const suffissoLingua = lang === 'fr' ? '.fr' : '';

  try {
    const response = await fetch(`./data/guide_montature/${idMontatura}${suffissoLingua}.json`);
    if (!response.ok) {
      throw new Error(`Errore HTTP: ${response.status}`);
    }
    const guidaData = await response.json();
    const capitolo = guidaData.capitoli[indiceCapitolo];
    if (!capitolo) {
      const msgNoCap = lang === 'fr' ? "Chapitre non trouvé." : "Capitolo non trovato.";
      container.innerHTML = `<p style="color:red;padding:10px;">${msgNoCap}</p>`;
      return;
    }
    // Formatta il testo convertendo sia \n che ** tramite la funzione ausiliaria
    let testoFormatted = formattaTestoGuida(capitolo.contenuto);
    // Gestione localizzata del testo del pulsante Indietro
    const testoBottoneIndietro = lang === 'fr' ? "← Retour à l'index dei Chapitres" : "← Torna all'indice dei Capitoli";
    container.innerHTML = `
      <div style="margin-top:15px;background:#ffffff;padding:14px;border-radius:10px;border:1px solid #d0e6f7;box-shadow:0 3px 8px rgba(0,0,0,0.08);text-align:left;">
        <button onclick="caricaGuidaMontatura('${idMontatura}')" style="margin-bottom:12px;padding:6px 12px;border-radius:6px;background:#0a2a43;border:none;color:white;font-size:12px;font-weight:bold;cursor:pointer;">
          ${testoBottoneIndietro}
        </button>
        <h3 style="margin:0 0 6px 0;color:#0a2a43;font-size:16px;">${capitolo.titolo}</h3>
        ${capitolo.sottotitolo ? `<p style="margin:0 0 12px 0;opacity:0.7;font-size:12px;font-weight:bold;">${capitolo.sottotitolo}</p>` : ''}
        <div style="font-size:13px;line-height:1.6;color:#222;border-top:1px solid #eee;padding-top:10px;">
          ${testoFormatted}
        </div>
      </div>
    `;
  } catch (error) {
    console.error("Errore nell'apertura del capitolo:", error);
    const msgErrOpen = lang === 'fr' ? "Impossible d'ouvrir le chapitre. Vérifiez le fichier JSON." : "Impossibile aprire il capitolo. Verifica il nome del file JSON.";
    container.innerHTML = `<p style="color:red;padding:10px;">${msgErrOpen}</p>`;
  }
}

</script>
